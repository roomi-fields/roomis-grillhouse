name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # The release (release.yml) plays the CI on the tagged commit before it publishes.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The pinned program temporal, got as a user gets it: downloaded, checked against the sum
      # pinned in the code, laid under ~/.cache/grillhouse/temporal/<version>/, no unit of systemd;
      # the tests that play a workflow run it (TEMPORAL, grillhouse.outils of the root package.json).
      # `npm ci` built the command (the package's `prepare`).
      - name: Install the pinned temporal
        run: echo "TEMPORAL=$(npx grillhouse temporal installer --programme-seul)" >> "$GITHUB_ENV"

      # uv, which the module python plays: its skeleton reads the standard library of Python
      # through it, and its passes run pytest through it.
      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # The command claude, at a fixed version: the guards of the repository (its root script
      # `gardes`) play the tests of the frame's plugin, `claude plugin test mods/grillhouse`.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.312

      # Formatting, lint, typing, build, guards and tests: the one command of the poste.
      - name: Verification
        run: npm run verifier

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Check package
        run: npm pack --dry-run --workspace @roomi-fields/grillhouse
