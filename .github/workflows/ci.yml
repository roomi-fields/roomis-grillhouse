name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # The release (release.yml) plays the CI on the tagged commit before it publishes.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The command claude, at a fixed version: the guards of the repository (its root script
      # `gardes`) play the tests of the frame's plugin, `claude plugin test mods/grillhouse`.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.312

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build --if-present

      - name: Guards and tests
        run: npm run verifier

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Check package
        run: npm pack --dry-run --workspace @roomi-fields/grillhouse
