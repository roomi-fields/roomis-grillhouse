name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Once a night, on the default branch: Node 22 and 24.
  schedule:
    - cron: '0 2 * * *'
  # The release (release.yml) plays the CI on the tagged commit before it publishes, on the
  # versions of Node its call names.
  workflow_call:
    inputs:
      node-versions:
        description: 'The versions of Node to play, a JSON array'
        type: string
        default: '["22.x"]'

jobs:
  test:
    runs-on: ubuntu-latest

    # The versions come from the input of the call; push and pull request play Node 22 alone,
    # the nightly schedule plays Node 22 and 24.
    strategy:
      matrix:
        node-version: ${{ fromJSON(inputs.node-versions || (github.event_name == 'schedule' && '["22.x","24.x"]' || '["22.x"]')) }}

    steps:
      # The whole history: the base of a push (github.event.before) must be in the clone.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # uv, which the module python plays: its skeleton reads the standard library of Python
      # through it, and its passes run pytest through it.
      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # The command claude, at a fixed version: the guards of the repository (its root script
      # `gardes`) play the tests of the frame's plugin, `claude plugin test mods/grillhouse`.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.312

      # Formatting, lint, typing, build, guards and tests: the one command of the poste.
      # A push is measured against the commit before it (the parent of main); a pull request, the
      # call by the release and the nightly schedule play the complete pass, with no base.
      - name: Verification (a push, against its parent)
        if: github.event_name == 'push' && github.event.before != ''
        run: npm run verifier ${{ format('--base {0}', github.event.before) }}

      - name: Verification
        if: github.event_name != 'push' || github.event.before == ''
        run: npm run verifier

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Check package
        run: npm pack --dry-run --workspace @roomi-fields/grillhouse
