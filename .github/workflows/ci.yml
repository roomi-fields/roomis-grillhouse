name: CI

on:
  # `agent/**`: the branch of a ticket the queue of the frame pushes; its run judges the lot before
  # main moves onto it (packages/grillhouse/scripts/integration/file.mjs).
  push:
    branches: [main, develop, 'agent/**']
  pull_request:
    branches: [main, develop]
  # Once a night, on the default branch: Node 24 and 26.
  schedule:
    - cron: '0 2 * * *'
  # The release (release.yml) plays the CI on the tagged commit before it publishes, on the
  # versions of Node its call names.
  workflow_call:
    inputs:
      node-versions:
        description: 'The versions of Node to play, a JSON array'
        type: string
        default: '["26.x"]'

# The pass of the verification in n + 2 jobs per version of Node, as Vitest shards a run
# (https://vitest.dev/guide/improving-performance#sharding): `gardes` plays every task but the
# tests (`npm run verifier -- --sans-tests`), each job of `tranches` the tests of its tranche
# (`npm run verifier -- --tranche i/n`), and `fusion` merges the reports of the n tranches, which it
# refuses when a file of the pass is missing or played twice. TRANCHES is n, and the matrix of
# `tranches` lists 1 to n: both change together.
env:
  TRANCHES: 3

  # The remote cache of Turborepo (grillhouse-44b.12.6), the server the repository's variables
  # TURBO_API and TURBO_TEAM name, its token and the key of its signature in the secrets
  # TURBO_TOKEN and TURBO_REMOTE_CACHE_SIGNATURE_KEY (Settings > Secrets and variables > Actions),
  # never in this file. A push to main or to a branch agent/** writes it (the run that judges the
  # tree the queue moves main onto); every other run reads it alone. Without TURBO_API the cache is
  # the runner's local cache, as before. No step of the workflow touches the cache.
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
  TURBO_CACHE: ${{ !vars.TURBO_API && 'local:rw' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/agent/')) && 'local:rw,remote:rw' || 'local:rw,remote:r') }}

jobs:
  gardes:
    # The machine of the jobs: the variable RUNNER of the repository, GitHub's runner without it.
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}

    # The versions come from the input of the call; push and pull request play Node 26 alone,
    # the nightly schedule plays Node 24 and 26.
    strategy:
      matrix:
        node-version: ${{ fromJSON(inputs.node-versions || (github.event_name == 'schedule' && '["24.x","26.x"]' || '["26.x"]')) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # uv, which the module python plays: its skeleton reads the standard library of Python
      # through it. A runner of our own has it installed.
      - name: Install uv
        if: runner.environment == 'github-hosted'
        uses: astral-sh/setup-uv@v6

      # The command claude, at a fixed version: the guards of the repository (its root script
      # `gardes`) play the tests of the frame's plugin, `claude plugin test mods/grillhouse`.
      - name: Install Claude Code
        if: runner.environment == 'github-hosted'
        run: npm install -g @anthropic-ai/claude-code@2.1.312

      # Build, guards, typing, formatting and lint: every task of the pass but the tests.
      - name: Verification without the tests
        run: npm run verifier -- --sans-tests

  tranches:
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}

    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(inputs.node-versions || (github.event_name == 'schedule' && '["24.x","26.x"]' || '["26.x"]')) }}
        tranche: [1, 2, 3]

    steps:
      # The whole history: the base of a push (github.event.before) must be in the clone.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # uv, which the module python plays: its passes run pytest through it.
      - name: Install uv
        if: runner.environment == 'github-hosted'
        uses: astral-sh/setup-uv@v6

      # The command claude, at a fixed version: a test of the plugin's package validates it with
      # `claude plugin validate` when the command answers.
      - name: Install Claude Code
        if: runner.environment == 'github-hosted'
        run: npm install -g @anthropic-ai/claude-code@2.1.312

      # The tests of the tranche, with the builds they depend on. A push is measured against the
      # commit before it (the parent of main); a pull request, the call by the release and the
      # nightly schedule play the complete pass, with no base.
      - name: Tranche ${{ matrix.tranche }} (a push, against its parent)
        if: github.event_name == 'push' && github.event.before != ''
        run: npm run verifier -- ${{ format('--tranche {0}/{1} --base {2}', matrix.tranche, env.TRANCHES, github.event.before) }}

      - name: Tranche ${{ matrix.tranche }}
        if: github.event_name != 'push' || github.event.before == ''
        run: npm run verifier -- ${{ format('--tranche {0}/{1}', matrix.tranche, env.TRANCHES) }}

      # The reports of the tranche (Vitest's blob and the files of its part), red or green, which
      # the job fusion merges.
      - name: Reports of the tranche
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: tranche-${{ matrix.node-version }}-${{ matrix.tranche }}
          path: .vitest-reports/
          include-hidden-files: true
          # A pass with no test file (a push whose changes no test relates to) writes none.
          if-no-files-found: warn
          retention-days: 7

  fusion:
    needs: tranches
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}

    strategy:
      matrix:
        node-version: ${{ fromJSON(inputs.node-versions || (github.event_name == 'schedule' && '["24.x","26.x"]' || '["26.x"]')) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Reports of the tranches
        uses: actions/download-artifact@v4
        with:
          pattern: tranche-${{ matrix.node-version }}-*
          path: .vitest-reports
          merge-multiple: true

      # Each file of the pass played by one tranche exactly, then one report of the n tranches.
      - name: Merge of the tranches
        run: npx --no-install grillhouse fusion-des-tranches

  build:
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    needs: [gardes, tranches, fusion]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Check package
        run: npm pack --dry-run --workspace @roomi-fields/grillhouse
