# The night of Grillhouse on PC2: once a night, on the default branch, the frame's night tests but
# those that bear the tag @poste (a night test that needs the session of the user, a secret, the real
# bd, the keyring or systemd; the guard `tests-du-poste` asks for the tag), the tests tagged @equipee
# included (the envelope, a Temporal server, the binaries of the module cargo: the equipment PC2
# has), in tranches, then the measures of time and of load alone on the dedicated cores. The poste
# (PC3) plays the tests tagged @poste alone, and the tranches PC2 did not start in time
# (scripts/repli-de-la-nuit.mjs, from scripts/nuit.sh).
#
# The slot of the night on PC2 is 01:45 → 03:45, Paris time: after the restart of 01:30, before the
# night of BPScript at 04:00. GitHub's schedules are in UTC, so 01:15 UTC (02:15 in winter, 03:15 in
# summer) lies inside it whatever the season. The CI of the private repositories plays by day; this
# repository's CI and its night wait for each other (the group `pc2`, no cancellation of the wait).
# A green run here is never the last green: the night of the poste (scripts/nuit.sh) keeps it.
name: Nuit

on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:

# One run at a time on PC2 for this repository, the night and the CI of the day: a run that waits is
# never cancelled by the next one, and the wait counts in the delay of the fallback.
concurrency:
  group: pc2
  cancel-in-progress: false

# The night in n + 2 jobs per version of Node: each job of `tranches` plays its tranche of the night
# tests out of the poste (`grillhouse tests-de-nuit --hors-du-poste --tranche i/n`), `fusion` merges
# the reports of the n tranches, which it refuses when a night test is missing or played twice, and
# `mesures` plays the measures of time and of load alone, after the tranches. TRANCHES is n, and the
# matrix of `tranches` lists 1 to n: both change together.
env:
  TRANCHES: 3

jobs:
  tranches:
    runs-on: [self-hosted, pc2]

    strategy:
      fail-fast: false
      matrix:
        node-version: ['26.x']
        tranche: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The project's preparation (system packages, toolchains), when its package.json has the
      # script `ci:preparer`; it may export variables to the next steps through $GITHUB_ENV.
      - name: Prepare the project
        run: npm run --if-present ci:preparer

      # uv, which the module python plays, laid down when the runner lacks it: no secret, no
      # administrator right.
      - name: Install uv
        run: |
          command -v uv >/dev/null || curl -LsSf https://astral.sh/uv/0.9.0/install.sh | UV_NO_MODIFY_PATH=1 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The command claude, at the version ci.yml installs, when the runner lacks it: the night tests
      # start it for its plugins alone (`claude plugin`), never for a session.
      - name: Install Claude Code
        run: |
          command -v claude >/dev/null || npm install -g --prefix "$HOME/.local" @anthropic-ai/claude-code@2.1.323
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The builds the night tests start (the frame's dist/), as the night of the poste has them from
      # its complete pass.
      - name: Build
        run: npx --no-install turbo run build

      # The program temporal, at the version the frame pins and the sum it checks, laid down by the
      # frame's command (idempotent), and its path exported to the next steps.
      - name: Install Temporal
        env:
          COMMANDE_DU_CADRE: packages/grillhouse/bin/grillhouse.mjs
        run: |
          temporal="$(node "$COMMANDE_DU_CADRE" temporal installer --programme-seul)"
          echo "TEMPORAL=$temporal" >> "$GITHUB_ENV"

      # The night tests of the tranche, but those tagged @poste, without any measure of time.
      - name: Night tests out of the poste, tranche ${{ matrix.tranche }}
        run: npx --no-install grillhouse tests-de-nuit --hors-du-poste ${{ format('--tranche {0}/{1}', matrix.tranche, env.TRANCHES) }}

      # The reports of the tranche (Vitest's blob and the files of its part), red or green, which
      # the job fusion merges.
      - name: Reports of the tranche
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nuit-${{ matrix.node-version }}-${{ matrix.tranche }}
          path: .vitest-reports/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  fusion:
    needs: tranches
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, pc2]

    strategy:
      fail-fast: false
      matrix:
        node-version: ['26.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Reports of the tranches
        uses: actions/download-artifact@v4
        with:
          pattern: nuit-${{ matrix.node-version }}-*
          path: .vitest-reports
          merge-multiple: true

      # Each night test out of the poste played by one tranche exactly, then one report of the n
      # tranches.
      - name: Merge of the tranches
        run: npx --no-install grillhouse fusion-des-tranches

  # The measures of time and of load, alone, after the tranches, red or green: on the cores
  # `grillhouse.mesure` dedicates. A project with none of these tests plays nothing, and the job is
  # green.
  mesures:
    needs: tranches
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, pc2]

    strategy:
      fail-fast: false
      matrix:
        node-version: ['26.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx --no-install turbo run build

      - name: Measures of time and of load
        run: npx --no-install grillhouse tests-de-nuit --mesures
