# The night of a shared machine: once a night, on the default branch, the frame's night tests but
# those that bear the tag @poste (a night test that depends on the poste: its envelope, its tools,
# its session; the guard `tests-du-poste` asks for the tag), on the versions of Node the nightly CI
# plays. No measure of time plays here: a shared machine does not measure a time (the frame's
# charter, « Une mesure de temps joue la nuit »). A green run here is never the last green: the night
# of the poste (scripts/nuit.sh) alone keeps it, after it plays every night test, the tagged ones
# included, then the benches and the time witnesses.
name: Nuit

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# The night in n + 1 jobs per version of Node, as the CI plays the verification (ci.yml): each job
# of `tranches` plays its tranche of the night tests out of the poste (`grillhouse tests-de-nuit
# --hors-du-poste --tranche i/n`), and `fusion` merges the reports of the n tranches, which it
# refuses when a night test is missing or played twice. TRANCHES is n, and the matrix of `tranches`
# lists 1 to n: both change together.
env:
  TRANCHES: 3

jobs:
  tranches:
    # The runner of the repository's variable RUNNER, GitHub's ubuntu-latest without it.
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}

    strategy:
      fail-fast: false
      matrix:
        node-version: ['24.x', '26.x']
        tranche: [1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # uv, which the module python plays; a runner of the repository brings its own.
      - name: Install uv
        if: runner.environment == 'github-hosted'
        uses: astral-sh/setup-uv@v6

      # The command claude, at the version ci.yml installs: the night tests start it for its plugins
      # alone (`claude plugin`), never for a session; a runner of the repository brings its own.
      - name: Install Claude Code
        if: runner.environment == 'github-hosted'
        run: npm install -g @anthropic-ai/claude-code@2.1.312

      # The builds the night tests start (the frame's dist/), as the night of the poste has them from
      # its complete pass.
      - name: Build
        run: npx --no-install turbo run build

      # The night tests of the tranche, but those tagged @poste, without any measure of time.
      - name: Night tests out of the poste, tranche ${{ matrix.tranche }}
        run: npx --no-install grillhouse tests-de-nuit --hors-du-poste ${{ format('--tranche {0}/{1}', matrix.tranche, env.TRANCHES) }}

      # The reports of the tranche (Vitest's blob and the files of its part), red or green, which
      # the job fusion merges.
      - name: Reports of the tranche
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nuit-${{ matrix.node-version }}-${{ matrix.tranche }}
          path: .vitest-reports/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  fusion:
    needs: tranches
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}

    strategy:
      fail-fast: false
      matrix:
        node-version: ['24.x', '26.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Reports of the tranches
        uses: actions/download-artifact@v4
        with:
          pattern: nuit-${{ matrix.node-version }}-*
          path: .vitest-reports
          merge-multiple: true

      # Each night test out of the poste played by one tranche exactly, then one report of the n
      # tranches.
      - name: Merge of the tranches
        run: npx --no-install grillhouse fusion-des-tranches
