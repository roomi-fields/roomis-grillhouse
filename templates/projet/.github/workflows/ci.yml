# Généré par `npx grillhouse maj` depuis le gabarit du cadre ; ne pas éditer : la mise à jour le réécrit. Un workflow sans cette ligne est au projet, et la mise à jour n'y touche pas.
#
# The CI of a lot: the verification of the frame (`npm run verifier`) in tranches, as Grillhouse
# plays its own (its .github/workflows/ci.yml).
name: CI

on:
  # The CI plays on main by batches, as Google's TAP plays the whole suite after the submit: once an
  # hour, on the tip of main, which judges every lot entered since its last pass. A lot enters main
  # on its final pass and waits for no CI; no push, no pull request and no branch agent/** starts it.
  # The job `moved` skips the pass when main did not move; a start by hand always plays.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  # A release plays the CI on the tagged commit before it publishes.
  workflow_call:

# The pass of the verification in n + 2 jobs per version of Node, as Vitest shards a run
# (https://vitest.dev/guide/improving-performance#sharding): `gardes` plays every task but the
# tests (`npm run verifier -- --sans-tests`), each job of `tranches` the tests of its tranche
# (`npm run verifier -- --tranche i/n`), and `fusion` merges the reports of the n tranches, which it
# refuses when a file of the pass is missing or played twice. TRANCHES is n, and the matrix of
# `tranches` lists 1 to n: both change together. The build of the project is proven by `gardes`:
# its guard tasks wait for the build of every package, so no job builds a second time.
env:
  TRANCHES: 3

  # The remote cache of Turborepo (grillhouse-44b.12.6), the server the repository's variables
  # TURBO_API and TURBO_TEAM name, its token and the key of its signature in the secrets
  # TURBO_TOKEN and TURBO_REMOTE_CACHE_SIGNATURE_KEY (Settings > Secrets and variables > Actions),
  # never in this file. The run of main, by the schedule or by hand, writes it; every other run reads it alone. Without TURBO_API the cache is
  # the runner's local cache, as before. No step of the workflow touches the cache.
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
  TURBO_CACHE: ${{ !vars.TURBO_API && 'local:rw' || ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && 'local:rw,remote:rw' || 'local:rw,remote:r') }}

# The machine of every job: the repository's variable RUNNER (Settings > Secrets and variables >
# Actions > Variables), a label in JSON (`"ubuntu-latest"`) or a list of labels
# (`["self-hosted","linux"]`); GitHub's ubuntu-latest without it. The variable lives in the
# repository's settings, never in this file.

jobs:
  # Main that did not move plays nothing again: on the schedule, when the last green pass of this
  # workflow on main is the commit of the tip, every job of the pass is skipped (a job skipped by its
  # condition reports « Success »). The job itself always runs, so that its dependents read its
  # output; a search that fails says nothing, and the pass plays. A start by hand or the call of a
  # release always plays. It reads the runs of the repository: a workflow that calls this one grants
  # it `actions: read`. On a runner of the repository, `gh` must be installed.
  moved:
    # The machine of the jobs: the variable RUNNER of the repository, GitHub's runner without it.
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    permissions:
      actions: read
      contents: read
    outputs:
      unchanged: ${{ steps.search.outputs.unchanged }}
    steps:
      - name: Last green pass of main
        id: search
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha' || true)
          if [ -n "$last" ] && [ "$last" = "$GITHUB_SHA" ]; then unchanged=true; else unchanged=false; fi
          echo "unchanged=$unchanged" >> "$GITHUB_OUTPUT"

  gardes:
    needs: moved
    if: needs.moved.outputs.unchanged != 'true'
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}

    # Node 26 alone, whatever the trigger.
    strategy:
      matrix:
        node-version: ['26.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # The submodules of the project, a private one read by the repository's secret SOUS_MODULES
          # (a token that reads it); without the secret, the workflow's own token.
          submodules: recursive
          token: ${{ secrets.SOUS_MODULES || github.token }}

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # uv, which the frame's module python plays, for a project with packages of Python; a runner
      # of the repository brings its own.
      - name: Install uv
        if: runner.environment == 'github-hosted' && hashFiles('**/pyproject.toml') != ''
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: npm ci

      # The binaries of the project's languages that the verification runs (cargo's sccache,
      # nextest and cargo-deny, python's uv), each at its version; none for TypeScript alone.
      - name: Install the binaries of the languages
        run: npx --no-install grillhouse binaires

      # Build, guards, typing, formatting and lint: every task of the pass but the tests; the guard
      # tasks wait for the build of every package, which proves the project builds.
      - name: Verification without the tests
        run: npm run verifier -- --sans-tests

  tranches:
    needs: moved
    if: needs.moved.outputs.unchanged != 'true'
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}

    strategy:
      fail-fast: false
      matrix:
        node-version: ['26.x']
        tranche: [1, 2, 3]

    steps:
      # The whole history, for the guards that read it.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # The submodules of the project, a private one read by the repository's secret SOUS_MODULES
          # (a token that reads it); without the secret, the workflow's own token.
          submodules: recursive
          token: ${{ secrets.SOUS_MODULES || github.token }}

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install uv
        if: runner.environment == 'github-hosted' && hashFiles('**/pyproject.toml') != ''
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: npm ci

      # The binaries of the project's languages that the verification runs (cargo's sccache,
      # nextest and cargo-deny, python's uv), each at its version; none for TypeScript alone.
      - name: Install the binaries of the languages
        run: npx --no-install grillhouse binaires

      # The tests of the tranche, with the builds they depend on: the complete pass, with no base.
      - name: Tranche ${{ matrix.tranche }}
        run: npm run verifier -- ${{ format('--tranche {0}/{1}', matrix.tranche, env.TRANCHES) }}

      # The reports of the tranche (Vitest's blob and the files of its part), red or green, which
      # the job fusion merges.
      - name: Reports of the tranche
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: tranche-${{ matrix.node-version }}-${{ matrix.tranche }}
          path: .vitest-reports/
          include-hidden-files: true
          # A pass with no test file writes none.
          if-no-files-found: warn
          retention-days: 7

  fusion:
    needs: [moved, tranches]
    if: ${{ !cancelled() && needs.moved.outputs.unchanged != 'true' }}
    runs-on: ${{ fromJSON(vars.RUNNER || '"ubuntu-latest"') }}

    strategy:
      matrix:
        node-version: ['26.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The submodules of the project, a private one read by the repository's secret SOUS_MODULES
          # (a token that reads it); without the secret, the workflow's own token.
          submodules: recursive
          token: ${{ secrets.SOUS_MODULES || github.token }}

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Reports of the tranches
        uses: actions/download-artifact@v4
        with:
          pattern: tranche-${{ matrix.node-version }}-*
          path: .vitest-reports
          merge-multiple: true

      # Each file of Vitest's pass played by one tranche exactly, then one report of the n tranches.
      # The tests of Rust (nextest's `--partition hash:i/n`) and of Python (the first tranche alone)
      # have no report to merge: the job of their tranche is red on their red.
      - name: Merge of the tranches
        run: npx --no-install grillhouse fusion-des-tranches
